[project]
name = "wavegen"
version = "0.2.0"
description = "Vídeos musicais com waveform animado (imagem + músicas → MP4 para o YouTube), também exporta overlays transparentes para o DaVinci Resolve"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyside6-essentials>=6.7",
    "sounddevice>=0.5",
]

[project.scripts]
wavegen = "wavegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavegen"]
